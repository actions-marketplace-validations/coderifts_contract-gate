name: 'CodeRifts Contract Gate'
description: 'A required check: a contract change does not merge without a signed CodeRifts receipt, verified offline on the runner.'
# With require-grant: true the gate verifies a cr.exec.v1 or cr.exec.v2 grant token offline.
# With require_verified_monitoring: true the gate verifies a cr.monitor.attest.v1 token offline
# against a pinned monitoring keyring (CWM passes only on delivered_acked);
# by default it passes CWM on the host's claim. Without a receipt trailer the Action issues a receipt with the
# repository key, verifies it the same way, and puts it in the check summary — never in the commit.
author: 'CodeRifts'
branding:
  icon: 'lock'
  color: 'blue'

inputs:
  api-key:
    description: 'CodeRifts API key (used only to request a signed preflight receipt).'
    required: true
  api-url:
    description: 'CodeRifts API base URL.'
    required: false
    default: 'https://app.coderifts.com'
  github-token:
    description: 'Token with checks:write to post the "CodeRifts / contract-gate" Check Run.'
    required: false
    default: ${{ github.token }}
  check-name:
    description: >-
      Name of the check run this Action posts. Leave the default unless another integration
      already posts under that name; a changed name must also be the required-check context
      in branch protection.
    required: false
    default: 'CodeRifts / contract-gate'
  post-check-run:
    description: >-
      Whether this Action posts its own Check Run. Default true. Set to the exact string 'false'
      where another job already carries the required name — the example workflow's
      `if: always()` job named "CodeRifts / contract-gate". Both would post under the
      generic GitHub Actions identity, so two check-runs under one name come from one issuer
      and a readback cannot tell which one satisfied the requirement. (The CodeRifts App posts
      "CodeRifts / issuer", a different name, since 2026-09-28.) Only 'false' disables it; a
      typo leaves the check posting.
    required: false
    default: 'true'
  require-verified-monitoring:
    description: 'When true, CONTINUE_WITH_MONITORING passes only if a cr.monitor.attest.v1 token verifies offline (MON_ATTEST_VALID or retired-in-window) AND delivery_status is delivered_acked. Unsigned JSON is not accepted. Default false (existing consumers unchanged).'
    required: false
    default: 'false'
  monitoring-attestation:
    description: 'cr.monitor.attest.v1 token string (guard 9.2.0+ outcome.monitoring_attestation). Required when require-verified-monitoring is true and the decision is CWM. No network fetch.'
    required: false
    default: ''
  profile:
    description: >-
      enforcing (default): trailer-first reader. A head commit that already carries a
      CodeRifts-Receipt trailer and a .coderifts/receipts/<sha>.json sidecar is verified
      offline against the pinned keyring and the run does not call preflight. A human PR
      with no trailer is issued a receipt (preflight authorize) and that receipt is verified
      offline the same way before a green check is posted. The receipt is written to the
      check summary and is never committed back. require-verified-monitoring is on in this
      profile. Any other value keeps the historical preflight path.
    required: false
    default: 'enforcing'
  predicate-path:
    description: >-
      Workspace file written after a receipt verifies on the enforcing profile.
      The file is four fields copied off that receipt (execution_action, operation,
      target_id, expires_at). It is not signed and it is not committed.
      An empty string writes nothing.
    required: false
    default: 'decision-predicate.json'
  require-receipt-trailer:
    description: >-
      When true, the head commit must carry its own receipt — a `CodeRifts-Receipt:` commit trailer
      or a `.coderifts/receipts/<sha>.json` sidecar — that verifies OFFLINE against the pinned
      keyring, is an ALLOW, and whose signed envelope `artifact_digest` equals the digest of this
      pull request's contract diff. The envelope is required (a trailer carries only the token), so
      a trailer-only receipt fails. Missing, invalid, mismatched → failure. Default false (existing
      consumers unchanged).
    required: false
    default: 'false'
  require-grant:
    description: >-
      When true, BLOCK unless every changed governed path is covered by a valid cr.exec.v1
      or cr.exec.v2 execution grant bound to this repo and operation. v1 remains the
      back-compat form (existing consumers byte-identical). v2 is verified when presented.
      Default false. See ENFORCEMENT.md § Store-side grant coverage for the residuals.
    required: false
    default: 'false'
  bundle:
    description: >-
      Path to a cr.bundle.v1 proof bundle produced for this change set. ADDITIVE: omit it and this
      Action behaves exactly as before. When supplied, the merge slots (receipt + execution_grant)
      must grade PROVEN or the gate fails; other slots present in the bundle are NAMED in the
      output with their class and are never counted as proof. A PROVIDER_READBACK slot is an
      unsigned provider statement — it is reported, not accepted as proof. Grading is done by the
      vendored receipt-verifier library, not re-implemented here.
    required: false
    default: ''
  bundle-slot-keys:
    description: >-
      Path to the per-slot verification material for the bundle, in the shape the verify-bundle
      library documents: { "perSlot": { "<slot>": { "ctx": {...}, "opts": {...} } } }. Slots are
      signed by different parties, so there is no single keyring to default to. Keys are NEVER
      read from the bundle itself; a bundle carrying its own key would be self-certifying.
    required: false
    default: ''
  execution-grant:
    description: >-
      Compact cr.exec.v1 or cr.exec.v2 grant token covering this change set (required when
      require-grant is true). Offline verify against grant-keyring. This input is the compact
      grant token, not a DSSE envelope (DSSE unwrap applies to the receipt, not this field).
    required: false
    default: ''
  grant-keyring:
    description: 'Local keyring document for grant verification. No network fetch, ever.'
    required: false
    default: ''
  grant-operation:
    description: 'Operation this run represents; the grant must be bound to it.'
    required: false
    default: 'merge'
  monitoring-keyring:
    description: 'Local JSON file path for the customer-pinned monitoring-key registry ({ keys: [{ kid, public_key_pem, status, valid_from, retired_at }] }). Same shape as the receipt keyring / .well-known/coderifts-keys.json. Local file only — no fetch.'
    required: false
    default: ''

# The receipt is ALWAYS verified offline against the keyring pinned in this action
# (keyring/pinned-keys.json). The gate NEVER fetches the verification key from the server it is
# verifying. Requires actions/checkout with fetch-depth: 0 so base..head is available locally.
# Receipt (chain_receipt on the preflight response) may be a compact token or a DSSE/in-toto
# envelope; src/from-dsse.js unwraps to the compact token and verify.js decides. DSSE presence
# is not a pass. Grants (execution-grant) are compact cr.exec.v1 or cr.exec.v2 tokens.
runs:
  using: 'node20'
  main: 'src/index.js'
